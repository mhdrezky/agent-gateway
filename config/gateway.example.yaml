# Agent Gateway configuration. Copy to config/gateway.yaml and adjust.
# Any value can be overridden with AGW_<SECTION>__<KEY>, e.g. AGW_APPROVALS__TTL_MINUTES=30.

server:
  host: 0.0.0.0          # inside the container; docker-compose binds the port to 127.0.0.1
  port: 8080
  public_hosts: []       # extra Host names for /mcp, e.g. ["gateway.example.com"]

var_dir: /app/var
master_key_file: /run/secrets/agw_master_key

approvals:
  ttl_minutes: 15
  elevation_minutes: 15   # approved ssh.sudo opens a window this long; 0 = approve every command

execution:
  max_concurrent: 8
  output_limit_bytes: 65536

audit:
  daily_anchor: true

rate_limit:
  auth_failures_per_minute: 10

actions:
  disabled: []

brokers:
  docker:
    enabled: false       # mounting the Docker socket is root-equivalent on the host
    socket: unix:///var/run/docker.sock
  sql:
    enabled: false       # sql.query on sql_database resources (read-only, gated SELECT)
  smtp:
    enabled: false       # mail.send (SPEC §11.5); only on the instance that sends mail

bind:
  roles: [author, reviewer]   # user roles that may call POST /v1/bind

# Access admins who sign in through an app (agentgate console) with X-User-Token (SPEC §23).
# Infra: only this file sets it. Without user_roles nobody is an access admin.
# admin:
#   user_roles: [platform-admin]        # users.json roles that make a user an access admin
#   apply_requires_second_admin: false  # production: true (planner may not apply)
#   directory:                          # read-only IdP directory (users, groups)
#     provider: keycloak
#     base_url: http://keycloak:8080
#     realm: agentgate-dev
#     client_id: agentgate-directory
#     credential: keycloak-directory    # credential (type api_token) holding the client secret
#     groups_full_path: false           # true when the groups claim carries "/staff"
