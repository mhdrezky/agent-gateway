# Test targets for `pytest -m broker`. See tests/broker/README.md.
services:
  sshd:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      USER_NAME: deploy
      PUBLIC_KEY_FILE: /keys/id_ed25519.pub
      PASSWORD_ACCESS: "false"
      SUDO_ACCESS: "false"
    volumes:
      - ./.keys:/keys:ro
    ports:
      - "127.0.0.1:2222:2222"

  # Labelled container the docker broker may touch.
  managed:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do echo agw-test-tick; sleep 5; done"]
    labels:
      agw.managed: "true"
    container_name: agw-test-managed

  # Unlabelled container the docker broker must never see.
  unmanaged:
    image: busybox:1.36
    command: ["sh", "-c", "sleep infinity"]
    container_name: agw-test-unmanaged
