[project]
name = "agent-gateway"
version = "0.1.0"
description = "Unified access and action management gateway for AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.18",
    "cryptography>=43",
    "fastapi>=0.115",
    "filelock>=3.16",
    "httpx>=0.27",
    "jinja2>=3.1",
    "mcp>=1.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.9",
    "python-ulid>=3.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
agw = "agent_gateway.cli:app"
agw-mcp = "agent_gateway.apps.mcp_server.server:main"
agw-onboard-ssh = "agent_gateway.apps.onboarding.ssh_host:run"

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# devnote/ is prose; its code blocks are illustrative, not formatted source.
extend-exclude = ["devnote"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "PT", "N", "DTZ"]
# S105 flags every enum member containing "TOKEN"; secrets are covered by review and tests.
ignore = ["S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"tests/e2e/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["broker: needs a real SSH host, Docker engine, or SMTP server"]
addopts = "-m 'not broker'"
